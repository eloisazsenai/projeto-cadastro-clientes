<!doctype html>
<!-- Este é o documento HTML base no qual o Angular monta toda a aplicação. -->
<html lang="pt-BR">
<head>
  <!-- UTF-8 permite exibir corretamente acentos e caracteres especiais. -->
  <meta charset="utf-8">
  <title>ProjetoCadastroClientes</title>
  <!-- O Angular usa esta base para calcular URLs e futuras rotas. -->
  <base href="/">
  <!-- Faz a largura da página acompanhar a tela de celulares e tablets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- O Angular encontra este selector e coloca o AppComponent dentro dele. -->
  <app-root></app-root>
</body>
</html>
